; =============================================================================
; PHP Configuration - docker-php.ini
; =============================================================================
; Base PHP configuration for PHP 8.4-FPM
; Environment variables are substituted at runtime via entrypoint.sh
; =============================================================================

; Maximum execution time of each script, in seconds
max_execution_time = ${PHP_MAX_EXECUTION_TIME}

; Maximum amount of memory a script may consume
memory_limit = ${PHP_MEMORY_LIMIT}

; Maximum size of POST data that PHP will accept
post_max_size = ${PHP_POST_MAX_SIZE}

; Maximum allowed size for uploaded files
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}

; Maximum number of files that can be uploaded via a single request
max_file_uploads = 20

; Default timezone used by date functions
date.timezone = ${PHP_DATE_TIMEZONE}

; Whether to allow the treatment of URLs (like http:// or ftp://) as files
allow_url_fopen = On
allow_url_include = Off

; Whether to expose PHP version in headers
expose_php = Off

; Error reporting
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
track_errors = Off

; HTML errors
html_errors = Off

; Disable functions for security
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,symlink,link,dl,pcntl_exec

; Session configuration
session.save_handler = files
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

; OPcache will be configured in opcache.ini

; Disable deprecated warnings for production
; zend.exception_ignore_args = On

; Maximum input variables
max_input_vars = 3000
max_input_nesting_level = 64
max_input_time = ${PHP_MAX_EXECUTION_TIME}

; Realpath cache
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; OPcache JIT (PHP 8.0+)
; opcache.jit_buffer_size = 100M
; opcache.jit = 1255

; Multibyte string
mbstring.language = neutral
mbstring.internal_encoding = UTF-8
mbstring.http_input = pass
mbstring.http_output = pass
mbstring.encoding_translation = Off
mbstring.detect_order = auto
mbstring.substitute_character = none
mbstring.func_overload = 0

; GD
gd.jpeg_ignore_warning = 1

; MySQLi
mysqli.allow_local_infile = Off
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.max_persistent = -1
mysqli.cache_size = 2000
mysqli.default_port = 3306
mysqli.default_socket =
mysqli.default_host =
mysqli.default_user =
mysqli.default_pw =
mysqli.reconnect = Off

; PDO MySQL
pdo_mysql.default_socket =

; PostgreSQL
pgsql.allow_persistent = On
pgsql.auto_reset_persistent = Off
pgsql.max_links = -1
pgsql.max_persistent = -1
pgsql.ignore_notice = 0
pgsql.log_notice = 0

; SOAP
soap.wsdl_cache_enabled = 1
soap.wsdl_cache_dir = "/tmp"
soap.wsdl_cache_ttl = 86400
soap.wsdl_cache_limit = 5

; CURL
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

; OpenSSL
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
openssl.capath = /etc/ssl/certs

; FFI (Foreign Function Interface) - disabled by default for security
; ffi.enable = preload

; Sodium
; sodium.default_key_size = 32

; Zlib
zlib.output_compression = Off
zlib.output_compression_level = -1
zlib.output_handler =

; Iconv
iconv.input_encoding = UTF-8
iconv.internal_encoding = UTF-8
iconv.output_encoding = UTF-8

; Intl
intl.default_locale = en_US
intl.error_level = E_WARNING

; PCRE
pcre.backtrack_limit = 1000000
pcre.recursion_limit = 100000
pcre.jit = 1