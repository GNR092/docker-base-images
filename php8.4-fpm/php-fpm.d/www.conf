; =============================================================================
; PHP-FPM Pool Configuration - www.conf
; =============================================================================
; This file is processed by the entrypoint script to substitute environment variables
; =============================================================================

[www]

; Unix user/group of processes
user = www-data
group = www-data

; The address on which to accept FastCGI requests
; Valid syntaxes are:
;   'ip.add.re.ss:port'    - to listen on a TCP socket to a specific IPv4 address on a specific port
;   '[ip:6:addr:ess]:port' - to listen on a TCP socket to a specific IPv6 address on a specific port
;   'port'                 - to listen on a TCP socket to all addresses (IPv6 and IPv4-mapped) on a specific port
;   '/path/to/unix/socket' - to listen on a unix socket
; Note: This value is mandatory
listen = ${PHP_FPM_LISTEN}

; Set listen(2) backlog
; Default Value: 511 (-1 on FreeBSD and OpenBSD)
listen.backlog = 511

; Set permissions for unix socket, if one is used. In Linux, read/write
; permissions must be set in order to allow connections from a web server.
; Default Values: user and group are set as the running user
;                 mode is set to 0660
;listen.owner = www-data
;listen.group = www-data
;listen.mode = 0660

; List of addresses (IPv4/IPv6) of FastCGI clients which are allowed to connect.
; Equivalent to the FCGI_WEB_SERVER_ADDRS environment variable in the original PHP-FPM.
; Makes sense only with a tcp listening socket. Each address must be separated by a comma.
; If this value is not set, connections will be accepted from any IP address.
; Default Value: (not set = any)
;listen.allowed_clients = 127.0.0.1

; Choose how the process manager will control the number of child processes.
; Possible Values:
;   static  - a fixed number (pm.max_children) of child processes
;   dynamic - the number of child processes is set dynamically based on the following directives:
;             pm.max_children      - the maximum number of children that can be alive at the same time
;             pm.start_servers     - the number of children created on startup
;             pm.min_spare_servers - the minimum number of children in 'idle' state (waiting to process)
;             pm.max_spare_servers - the maximum number of children in 'idle' state (waiting to process)
;   ondemand - no children are created at startup. Children will be forked when new requests connect.
;              The following parameter are used:
;              pm.max_children           - the maximum number of children that can be alive at the same time
;              pm.process_idle_timeout   - number of seconds after which an idle process will be killed
; Note: This value is mandatory
pm = ${PHP_FPM_PM}

; The number of child processes to be created when pm is set to 'static' and the
; maximum number of child processes when pm is set to 'dynamic' or 'ondemand'.
; This value sets the limit on the number of simultaneous requests that will be served.
; Equivalent to the ApacheMaxClients directive with mpm_prefork.
; Equivalent to the PHP_FCGI_CHILDREN environment variable in the original PHP-FPM.
; Note: Used when pm is set to 'static', 'dynamic' or 'ondemand'
; Note: This value is mandatory
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}

; The number of child processes created on startup.
; Note: Used only when pm is set to 'dynamic'
; Default Value: min_spare_servers + (max_spare_servers - min_spare_servers) / 2
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}

; The desired minimum number of idle server processes.
; Note: Used only when pm is set to 'dynamic'
; Note: Mandatory when pm is set to 'dynamic'
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}

; The desired maximum number of idle server processes.
; Note: Used only when pm is set to 'dynamic'
; Note: Mandatory when pm is set to 'dynamic'
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}

; The number of seconds after which an idle process will be killed.
; Note: Used only when pm is set to 'ondemand'
; Default Value: 10s
;pm.process_idle_timeout = 10s

; The number of requests each child process should execute before respawning.
; This can be useful to work around memory leaks in 3rd party libraries.
; For endless request processing specify '0'. Equivalent to PHP_FCGI_MAX_REQUESTS.
; Default Value: 0
pm.max_requests = 500

; The URI to view the FPM status page. If this value is not set, no URI will be
; recognized as a status page. It shows the following information:
;   pool                 - the name of the pool
;   process manager      - static, dynamic or ondemand
;   start time           - the date and time FPM has started
;   start since          - number of seconds since FPM has started
;   accepted conn        - the number of request accepted by the pool
;   listen queue         - the number of request in the queue of pending connections
;   max listen queue     - the maximum number of requests in the queue of pending connections since FPM has started
;   listen queue len     - the size of the socket queue of pending connections
;   idle processes       - number of idle processes
;   active processes     - number of active processes
;   total processes      - number of idle + active processes
;   max active processes - maximum number of active processes since FPM has started
;   max children reached - number of times, the process limit has been reached
;   slow requests        - number of requests that exceeded 'request_slowlog_timeout'
; The values of 'idle processes', 'active processes' and 'total processes' are updated each second.
; The value of 'accepted conn' is updated in real time.
; Example output:
;   pool:                 www
;   process manager:      dynamic
;   start time:           01/Jul/2011:17:53:49 +0200
;   start since:          633
;   accepted conn:        190460
;   listen queue:         0
;   max listen queue:     1
;   listen queue len:     0
;   idle processes:       4
;   active processes:     11
;   total processes:      15
;   max active processes: 12
;   max children reached: 0
;   slow requests:        0
; Note: Must start with a leading slash (/). The value can be anything but it may be
;       a good idea to use the pool name followed by a forward slash.
; Default Value: not set
;pm.status_path = /status

; The ping URI to call the monitoring page of FPM. If this value is not set, no URI
; will be recognized as a ping page. This could be used to test from outside that FPM
; is alive and responding, or to create a graph of FPM availability (rrd or such).
; Note: Must start with a leading slash (/). The value can be anything but it may be
;       a good idea to use the pool name followed by a forward slash.
; Default Value: not set
;ping.path = /ping

; This directive may be used to customize the response of a ping request. The response
; is formatted as text/plain with a 200 response code.
; Default Value: pong
;ping.response = pong

; The access log file
; Default: not set
;access.log = log/$pool.access.log

; The access log format.
; The following syntax is allowed:
;  %%: the '%' character
;  %C: %CPU used by the request
;  %d: time taken to serve the request
;  %e: an environment variable (same as $_ENV or $_SERVER)
;  %f: script filename
;  %l: content-length of the request (for POST request only)
;  %m: request method
;  %M: peak of memory allocated by PHP
;  %n: pool name
;  %o: output header
;  %p: PID of the child that serviced the request
;  %P: PID of the parent of the child that serviced the request
;  %q: the query string
;  %Q: the '?' character if query string exists
;  %r: request URI (without the query string)
;  %R: remote IP address
;  %s: status (response code)
;  %t: server time the request was received
;  %T: time the log has been written (the request has finished)
;  %u: remote user
;
; Default: "%R - %u %t \"%m %r\" %s"
;access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; The log file for slow requests
; Default Value: not set
; Note: slowlog is mandatory if request_slowlog_timeout is set
slowlog = /var/log/php-fpm/www-slow.log

; The timeout for serving a single request after which a PHP backtrace will be dumped
; to the 'slowlog' file. A value of '0s' means 'off'.
; Available units: s(econds)(default), m(inutes), h(ours), or d(ays)
; Default Value: 0
request_slowlog_timeout = 30s

; The timeout for serving a single request after which the worker process will be killed.
; This option should be used when the 'max_execution_time' ini option does not stop
; script execution for some reason. A value of '0' means 'off'.
; Available units: s(econds)(default), m(inutes), h(ours), or d(ays)
; Default Value: 0
request_terminate_timeout = 300s

; Set open file descriptor rlimit.
; Default Value: system defined value
;rlimit_files = 1024

; Set max core size rlimit.
; Possible Values: 'unlimited' or an integer greater or equal to 0
; Default Value: system defined value
;rlimit_core = 0

; Chroot to this directory at the start. This value must be defined as an absolute path.
; When this value is not set, chroot is not used.
; Note: you can prefix with '$prefix' to chroot to the pool prefix.
; Example: chroot = $prefix/var/www
; Default Value: not set
;chroot =

; Chdir to this directory at the start.
; Note: you can prefix with '$prefix' to chdir to the pool prefix.
; Default Value: current directory or / when chroot
chdir = /var/www/html

; Catch workers output and redirect into the main error log. If not set, stdout and
; stderr will be redirected to /dev/null according to FastCGI specs.
; Note: on highloaded environment, this can cause some delay in the page process time
; (several ms).
; Default Value: no
catch_workers_output = yes

; Clear environment in FPM workers
; Prevents arbitrary environment variables from reaching FPM worker processes
; by clearing the environment in workers before env vars specified in this pool
; configuration are added.
; Setting to "no" will make all environment variables available to PHP code
; via getenv(), $_ENV and $_SERVER.
; Default Value: yes
clear_env = no

; Limits the extensions of the main script FPM will allow to parse. This can
; prevent configuration mistakes on the web server side. You should only limit
; FPM to .php extensions to prevent malicious users to use other extensions to
; execute php code.
; Note: set an empty value to allow all extensions
; Default Value: .php
security.limit_extensions = .php

; Pass environment variables like LD_LIBRARY_PATH. All $VARIABLEs are taken from
; the current environment.
; Default Value: clean env
;env[HOSTNAME] = $HOSTNAME
;env[PATH] = /usr/local/bin:/usr/bin:/bin
;env[TMP] = /tmp
;env[TMPDIR] = /tmp
;env[TEMP] = /tmp

; Additional php.ini defines, specific to this pool of workers. These settings
; overwrite the values previously defined in the php.ini. The directives are the
; same as the PHP SAPI:
;   php_value/php_flag             - you can set classic ini defines which can
;                                    be overwritten from PHP code 'ini_set'
;   php_admin_value/php_admin_flag - these directives won't be overwritten by
;                                    PHP code 'ini_set'
; For php_*flag, valid values are on, off, 1, 0, true, false, yes, no.
; Defining 'extension' will load the corresponding shared extension from
; extension_dir. Defining 'disable_functions' or 'disable_classes' will not
; overwrite previously defined php.ini values, but will append the new value
; instead.
; Note: path INI options can be relative and will be expanded with the prefix
; (pool, global or /usr/local/php)
; Default Value: nothing is defined by default except the values in php.ini and
;                specified at startup with the -d argument
;php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i -f www@my.domain.com
php_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = ${PHP_MEMORY_LIMIT}
php_admin_value[max_execution_time] = ${PHP_MAX_EXECUTION_TIME}
php_admin_value[upload_max_filesize] = ${PHP_UPLOAD_MAX_FILESIZE}
php_admin_value[post_max_size] = ${PHP_POST_MAX_SIZE}
php_admin_value[date.timezone] = ${PHP_DATE_TIMEZONE}