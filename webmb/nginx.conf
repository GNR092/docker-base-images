    worker_processes auto;
    worker_rlimit_nofile 65535;

    events {
        worker_connections 8192;
        multi_accept on;
    }

    http {
        server_tokens off;
        include       mime.types;
        default_type  application/octet-stream;

        # Logs
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log main;
        error_log   /var/log/nginx/error.log warn;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # 🔧 GZIP AJUSTADO (evita errores con Ctrl+F5)
        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_min_length 512;
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/javascript
            application/xml
            application/xml+rss
            text/xml;

        # Límites
        client_max_body_size 100M;
        client_body_timeout 120s;
        client_header_timeout 120s;
        send_timeout 120s;

        # Rate limit (commented out to allow higher throughput)
        # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

        server {
            listen 80;
            server_name localhost;
            root /var/www/html/public;
            index index.php index.html;

            # Static files
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
                expires 1y;
                access_log off;
                log_not_found off;
            }

            # ✅ CSP FINAL (JS modernos, Webpack, workers, CI4)
            # ✅ CSP CORREGIDA (Sin saltos de línea extraños que corrompen el header)
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' blob:; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'self'; form-action 'self';" always;
            # URLs amigables
            location / {
                # limit_req zone=api_limit burst=10 nodelay; # Removed for higher throughput
                try_files $uri $uri/ /index.php?$query_string;
            }

            # PHP-FPM
            location ~ \.php$ {
                try_files $uri =404;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass app:9000;
                fastcgi_index index.php;
                include fastcgi_params;

                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                fastcgi_hide_header X-Powered-By;

                fastcgi_buffers 16 16k;
                fastcgi_buffer_size 32k;
                fastcgi_connect_timeout 600s;
                fastcgi_send_timeout 600s;
                fastcgi_read_timeout 600s;
                fastcgi_busy_buffers_size 32k;
            }

            # Archivos ocultos
            location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
            }

            # Carpetas sensibles CI4
            location ~ ^/(system|writable|vendor) {
                deny all;
            }
        }
    }
