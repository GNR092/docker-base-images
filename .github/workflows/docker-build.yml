name: Docker build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine
          - alpine-3.20-gosu
          - alpine-steamcmd
          - php8.4-fpm
          - php8.4-fpm-xdebug
          - ubuntu-steamcmd
          - weblvl
          - webmb
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          push: false
