; =============================================================================
; Xdebug Configuration - docker-php-ext-xdebug.ini
; =============================================================================
; Xdebug 3.x configuration for PHP 8.4
; All settings are configurable via environment variables (see entrypoint.sh)
; Default values are production-safe (Xdebug disabled by default)
; =============================================================================

; Load Xdebug extension
zend_extension=xdebug

; -----------------------------------------------------------------------------
; Mode Configuration
; -----------------------------------------------------------------------------
; XDEBUG_MODE: Comma-separated list of modes
;   off          - Disable Xdebug (default, production-safe)
;   develop      - Development helpers (var_dump enhancement, etc.)
;   debug        - Step debugging
;   trace        - Function tracing
;   profile      - Profiling
;   coverage     - Code coverage
;   gcstats      - Garbage collection statistics
;   deprecated   - Deprecated notices (development aid)
;
; Example: XDEBUG_MODE=debug,develop,trace
xdebug.mode = ${XDEBUG_MODE}

; -----------------------------------------------------------------------------
; Step Debugging Configuration
; -----------------------------------------------------------------------------
; XDEBUG_CLIENT_HOST: Host where the IDE is listening
;   Default: host.docker.internal (works on Docker Desktop Mac/Windows)
;   For Linux: use host IP or 'host.docker.internal' with --add-host
xdebug.client_host = ${XDEBUG_CLIENT_HOST}

; XDEBUG_CLIENT_PORT: Port where the IDE is listening
;   Default: 9003 (standard for Xdebug 3)
xdebug.client_port = ${XDEBUG_CLIENT_PORT}

; XDEBUG_START_WITH_REQUEST: When to start debugging
;   yes   - Always start debugging (for CLI scripts, use trigger)
;   no    - Only start when triggered via browser extension/cookie
;   trigger - Start when XDEBUG_TRIGGER is present
xdebug.start_with_request = ${XDEBUG_START_WITH_REQUEST}

; XDEBUG_DISCOVER_CLIENT_HOST: Auto-discover client host via HTTP headers
;   true  - Try to detect from X-Forwarded-For, etc.
;   false - Use client_host setting (default)
xdebug.discover_client_host = ${XDEBUG_DISCOVER_CLIENT_HOST}

; XDEBUG_IDE_KEY: IDE key for DBGp proxy
;   Default: PHPSTORM
xdebug.idekey = ${XDEBUG_IDE_KEY}

; XDEBUG_LOG: Log file for Xdebug communication
;   Set to empty string to disable logging
;   Default: /var/log/php-fpm/xdebug.log
xdebug.log = ${XDEBUG_LOG}

; XDEBUG_LOG_LEVEL: Log verbosity (bitmask)
;   1 = errors, 2 = warnings, 4 = info, 8 = debug, 16 = trace
;   7 = errors + warnings + info (recommended)
;   31 = all (very verbose)
xdebug.log_level = ${XDEBUG_LOG_LEVEL}

; -----------------------------------------------------------------------------
; Debugging Behavior
; -----------------------------------------------------------------------------
; Maximum nesting level for function calls
xdebug.max_nesting_level = ${XDEBUG_MAX_NESTING_LEVEL}

; Maximum stack frames to show
xdebug.max_stack_frames = ${XDEBUG_MAX_STACK_FRAMES}

; Show error trace
xdebug.show_error_trace = ${XDEBUG_SHOW_ERROR_TRACE}

; Show exception trace
xdebug.show_exception_trace = ${XDEBUG_SHOW_EXCEPTION_TRACE}

; Show local variables in stack traces
xdebug.show_local_vars = ${XDEBUG_SHOW_LOCAL_VARS}

; -----------------------------------------------------------------------------
; Tracing Configuration (when mode=trace)
; -----------------------------------------------------------------------------
; xdebug.trace_output_dir = /tmp
; xdebug.trace_output_name = trace.%c.%p
; xdebug.trace_format = 0
; xdebug.trace_options = 0
; xdebug.collect_includes = 1
; xdebug.collect_params = 0
; xdebug.collect_return = 0
; xdebug.collect_vars = 0

; -----------------------------------------------------------------------------
; Profiling Configuration (when mode=profile)
; -----------------------------------------------------------------------------
; xdebug.profiler_output_dir = /tmp
; xdebug.profiler_output_name = cachegrind.out.%p
; xdebug.profiler_append = 0
; xdebug.profiler_enable_trigger = 0
; xdebug.profiler_enable_trigger_value = ""

; -----------------------------------------------------------------------------
; Code Coverage Configuration (when mode=coverage)
; -----------------------------------------------------------------------------
; xdebug.coverage_enable = 1
; xdebug.coverage_filter = ""
; xdebug.coverage_filter_exclude = ""

; -----------------------------------------------------------------------------
; Development Helpers (when mode=develop)
; -----------------------------------------------------------------------------
; xdebug.var_display_max_children = 128
; xdebug.var_display_max_data = 512
; xdebug.var_display_max_depth = 3
; xdebug.cli_color = 1
; xdebug.dump_globals = 1
; xdebug.dump_once = 1
; xdebug.dump_undefined = 0
; xdebug.dump.REQUEST = *
; xdebug.dump.SERVER = REMOTE_ADDR,REQUEST_METHOD,REQUEST_URI
; xdebug.dump.COOKIE = *
; xdebug.dump.ENV = *
; xdebug.dump.FILES = *
; xdebug.dump.GET = *
; xdebug.dump.POST = *
; xdebug.dump.SESSION = *

; -----------------------------------------------------------------------------
; GC Stats (when mode=gcstats)
; -----------------------------------------------------------------------------
; xdebug.gc_stats_output_dir = /tmp
; xdebug.gc_stats_output_name = gcstats.%p