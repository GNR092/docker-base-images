; =============================================================================
; OPcache Configuration - opcache.ini
; =============================================================================
; Optimized for PHP 8.4-FPM production environments
; All settings configurable via environment variables (see entrypoint.sh)
; =============================================================================

; Enable OPcache
opcache.enable = ${OPCACHE_ENABLE}

; Enable OPcache for CLI
opcache.enable_cli = ${OPCACHE_ENABLE_CLI}

; Memory consumption in megabytes
opcache.memory_consumption = ${OPCACHE_MEMORY_CONSUMPTION}

; Interned strings buffer in megabytes
opcache.interned_strings_buffer = ${OPCACHE_INTERNED_STRINGS_BUFFER}

; Maximum number of keys (scripts) in the hash table
opcache.max_accelerated_files = ${OPCACHE_MAX_ACCELERATED_FILES}

; Wasted memory percentage threshold for restart
opcache.max_wasted_percentage = 5

; Validate timestamps (check for file updates)
; Set to 0 for production with immutable deployments
opcache.validate_timestamps = ${OPCACHE_VALIDATE_TIMESTAMPS}

; Revalidation frequency in seconds (0 = every request when validate_timestamps=1)
opcache.revalidate_freq = ${OPCACHE_REVALIDATE_FREQ}

; Fast shutdown
opcache.fast_shutdown = ${OPCACHE_FAST_SHUTDOWN}

; Enable file cache (experimental)
; opcache.file_cache = /tmp/opcache
; opcache.file_cache_only = 0
; opcache.file_cache_consistency_checks = 1

; Save comments (required for annotations/attributes)
opcache.save_comments = 1

; Load comments
opcache.load_comments = 1

; Enable huge pages (requires OS support)
; opcache.huge_code_pages = 1

; Optimization level
; 0x7FFEBFFF = all optimizations except dangerous ones
; See: https://www.php.net/manual/en/opcache.configuration.php#ini.opcache.optimization-level
opcache.optimization_level = 0x7FFEBFFF

; Blacklist files (patterns of files to not cache)
; opcache.blacklist_filename = /usr/local/etc/php/conf.d/opcache-blacklist.txt

; Maximum file size to cache (0 = unlimited)
opcache.max_file_size = 0

; Consistency checks (0 = none, 1 = every N requests)
opcache.consistency_checks = 0

; Force restart if cache is corrupted
opcache.force_restart_timeout = 180

; Error log
opcache.error_log = /var/log/php-fpm/opcache.log

; Log verbosity
opcache.log_verbosity_level = 1

; Record warnings
opcache.record_warnings = 0

; Preferred memory model (mmap, shm, posix)
; opcache.preferred_memory_model =

; Protect memory
opcache.protect_memory = 0

; Restrict API
; opcache.restrict_api =

; JIT Configuration (PHP 8.0+)
; opcache.jit_buffer_size = 100M
; opcache.jit = tracing
; opcache.jit_debug = 0
; opcache.jit_bisect_limit = 0
; opcache.jit_hot_func = 127
; opcache.jit_hot_loop = 64
; opcache.jit_hot_return = 8
; opcache.jit_hot_side_exit = 8
; opcache.jit_max_exit_counters = 8192
; opcache.jit_max_loop_unrolls = 8
; opcache.jit_max_polynomial_order = 7
; opcache.jit_max_recursive_calls = 16
; opcache.jit_max_recursive_returns = 2
; opcache.jit_max_root_traces = 1024
; opcache.jit_max_side_traces = 128
; opcache.jit_prof_threshold = 0.005